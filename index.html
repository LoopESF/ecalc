<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Écalc</title><meta name="theme-color" content="#eaf2fc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Écalc"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><style>body{font:16px system-ui;background:#f5f7fa;color:#172235;margin:0;padding:20px}.app{max-width:550px;margin:auto;background:white;border-radius:20px;padding:24px;box-shadow:0 8px 35px #15243b15}h1{margin:0 0 6px}p{color:#566274;line-height:1.5}label{display:block;margin:15px 0 5px;font-weight:650}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #aeb8c5;border-radius:9px;font-size:18px}.result{background:#eaf2fc;padding:18px;border-radius:12px;margin-top:20px}.big{font-size:30px;font-weight:750}.muted{font-size:13px;color:#536278}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px 4px;text-align:right;border-bottom:1px solid #ddd}td:first-child,th:first-child{text-align:left}.warn{background:#fff3dc;padding:12px;border-radius:9px;font-size:14px}</style><main class="app"><h1>Écalc</h1><label>Porsjonsvekt (g)</label><input id="w" type="number" min="0" value="85"><label>Karbohydrater per 100 g</label><input id="c" type="number" min="0" value="45"><label>Fett per 100 g</label><input id="f" type="number" min="0" value="30"><label>Protein per 100 g</label><input id="p" type="number" min="0" value="6"><section class="result"><div>Karbohydrater i porsjonen</div><div class="big" id="carbs">–</div><div>Absorpsjonstid</div><div class="big" id="hours">–</div></section></main><script>const points=[[40,5,5,3],[40,15,5,4],[40,25,5,5],[40,35,5,5],[40,5,30,4],[40,25,30,5.5],[40,35,30,6],[15,25,5,5],[60,2,3,2],[25,0,0,2]];function model(c,f,p){let base=f<=2?2:f<=5?2+(f-2)/3:f<=15?3+(f-5)/10:f<=25?4+(f-15)/10:5;let extra=Math.max(0,Math.min(1,(p-5)/25));if(f>=15&&f<=25)extra*=.5;else if(f>25)extra*=Math.min(1,.5+(f-25)/20);let h=Math.min(6,Math.max(2,base+extra));return Math.round(h*2)/2}function update(){let w=+document.querySelector('#w').value||0,c=+document.querySelector('#c').value||0,f=+document.querySelector('#f').value||0,p=+document.querySelector('#p').value||0;let C=w*c/100,F=w*f/100,P=w*p/100;document.querySelector('#carbs').textContent=C.toLocaleString('nb-NO',{maximumFractionDigits:1})+' g';document.querySelector('#hours').textContent=model(C,F,P).toLocaleString('nb-NO')+' timer'}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',update));update()</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));}</script></html>
